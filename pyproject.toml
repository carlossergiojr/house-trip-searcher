[project]
name = "radar"
version = "0.1.0"
description = "Radar de imóveis para alugar e viagens com alertas no Telegram"
authors = [
    { email = "carlosslimajr@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.65.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
radar = "radar:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
