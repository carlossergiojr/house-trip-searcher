name: Radar de imóveis

on:
  # A internet sai pelo tablet de casa: sem ele, OLX e VivaReal respondem 403 aos IPs do GitHub.
  schedule:
    # Das 6h às 22h de Feira de Santana (UTC-3, sem horário de verão). O cron é em UTC:
    # 9h-23h UTC = 6h-20h local; 0h-1h UTC = 21h-22h local.
    # Minuto 7 porque na hora cheia o GitHub atrasa as execuções agendadas.
    - cron: "7 0,1,9-23 * * *"
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write # para salvar dados/imoveis.json no repositório
  id-token: write # login no Tailscale sem chave guardada (identidade do GitHub)

# Nunca duas rodadas ao mesmo tempo (mesmo papel do flock no cron local).
concurrency:
  group: radar-imoveis
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache do Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Instalar
        run: |
          uv sync --frozen
          uv run playwright install --with-deps chromium

      # Os sites bloqueiam IPs do GitHub: a partir daqui a internet sai pelo tablet de casa.
      # A regra de acesso do Tailscale (docs/tailscale-politica.hujson) só deixa este
      # aparelho usar a internet do tablet, sem acesso ao tablet nem à rede de casa.
      - name: Conectar ao tablet (Tailscale)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: radar-github
          args: --exit-node=${{ secrets.TS_EXIT_NODE }}

      # Não imprime o IP (o log é público): só confere que não é mais o do GitHub.
      - name: Conferir saída pela casa
        run: |
          provedor=$(curl -sS --max-time 20 https://ipinfo.io/org) || {
            echo "Sem internet pelo tablet: ele está ligado, no Wi-Fi e com o Tailscale ativo?"
            exit 1
          }
          case "$provedor" in
            *Microsoft*|*Azure*|*GitHub*)
              echo "A internet ainda sai pelo GitHub, não pelo tablet."
              exit 1 ;;
          esac
          echo "Saindo pela internet de casa."

      - name: Buscar e avisar
        env:
          IMOVEIS_BOT_TOKEN: ${{ secrets.IMOVEIS_BOT_TOKEN }}
          IMOVEIS_CHAT_ID: ${{ secrets.IMOVEIS_CHAT_ID }}
        run: uv run radar imoveis

      # Roda mesmo se a busca quebrar: o radar salva o que já enviou antes de sair.
      # O estado muda a cada rodada (contagem do dia para o resumo das 22h), então há um
      # commit por rodada. Esses commits contam como atividade: sem nenhuma em 60 dias,
      # o GitHub desliga o agendamento de repositórios públicos.
      - name: Salvar estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/imoveis.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: estado do radar de imóveis"
          for tentativa in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
